[package]
name = "calendar-cli"
version = "0.1.4"
edition = "2024"

[dependencies]
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = "0.29"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
oauth2 = { version = "5", features = ["reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
async-trait = "0.1"
url = "2"
unicode-bidi = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
