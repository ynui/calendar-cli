name: Release
on:
  push:
    branches: [test-release]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Archive binary
        run: |
          cd target/release
          gzip -c calendar-cli > calendar-cli-darwin.gz
          shasum -a 256 calendar-cli-darwin.gz > calendar-cli-darwin.gz.sha256
      - name: Set version
        run: |
          VERSION="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)-build.${{ github.run_number }}"
          echo "RELEASE_TAG=$VERSION" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: "Build ${{ github.run_number }} — ${{ github.event.head_commit.message }}"
          files: target/release/calendar-cli-darwin.gz*
