name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do"
            exit 0
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output calendar-cli \
            target/aarch64-apple-darwin/release/calendar-cli \
            target/x86_64-apple-darwin/release/calendar-cli

      - name: Package
        run: |
          mkdir pkg && mv calendar-cli pkg/
          tar -czf "calendar-cli-$VERSION-universal.tar.gz" -C pkg calendar-cli
          shasum -a 256 "calendar-cli-$VERSION-universal.tar.gz" > "calendar-cli-$VERSION-universal.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: "Autonomous sensors calendar-cli ${{ env.VERSION }}"
          files: |
            calendar-cli-${{ env.VERSION }}-universal.tar.gz
            calendar-cli-${{ env.VERSION }}-universal.tar.gz.sha256

      - name: Bump Homebrew tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN not set; skipping tap bump"; exit 0; fi
          VER="${VERSION#v}"
          SHA=$(shasum -a 256 "calendar-cli-$VERSION-universal.tar.gz" | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/ynui/homebrew-tap.git" tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"$VER\"/" \
                    -e "s|^  url \".*\"|  url \"https://github.com/ynui/calendar-cli/releases/download/$VERSION/calendar-cli-$VERSION-universal.tar.gz\"|" \
                    -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Formula/calendar-cli.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "calendar-cli $VER" && git push
